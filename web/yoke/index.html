<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1224">
<title>Valkyrie Yoke</title>
<style>
  :root { --bg:#0a1224; --panel:#121d38; --line:#24345c; --ink:#e8eefc; --dim:#8a9bc4; --amber:#ffb547; --go:#3ddc97; --red:#ff5c6c; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:600 15px/1.2 system-ui, -apple-system, sans-serif; overflow:hidden; touch-action:none; }
  #start { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; background:radial-gradient(circle at 50% 40%, #1b2d5c, var(--bg)); z-index:10; text-align:center; padding:16px; }
  #start h1 { margin:0; letter-spacing:.3em; font-size:22px; color:var(--amber); }
  #start button { font:800 22px system-ui; padding:22px 44px; border-radius:18px; border:0; background:var(--amber); color:#1a1200; }
  #start p { color:var(--dim); max-width:320px; margin:0; font-weight:500; }
  #app { position:fixed; inset:0; display:grid; grid-template-columns:96px 1fr 120px; gap:10px; padding:max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
  #thr { position:relative; background:var(--panel); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  #thrFill { position:absolute; left:0; right:0; bottom:0; background:linear-gradient(to top, var(--amber), #ffd58a); }
  #thrLbl { position:absolute; inset:auto 0 8px 0; text-align:center; font-size:13px; color:#1a1200; mix-blend-mode:normal; }
  #thrTop { position:absolute; inset:8px 0 auto 0; text-align:center; font-size:12px; color:var(--dim); }
  #mid { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; min-width:0; }
  #horizon { width:min(100%, 260px); aspect-ratio:1; border-radius:50%; border:2px solid var(--line); overflow:hidden; position:relative; background:#5a3a1e; }
  #sky { position:absolute; left:-50%; right:-50%; top:-50%; height:100%; background:#2a6fd6; transform-origin:50% 100%; }
  #reticle { position:absolute; left:50%; top:50%; width:60%; height:3px; background:var(--amber); transform:translate(-50%,-50%); border-radius:2px; }
  #status { font-size:12px; color:var(--dim); text-align:center; }
  #status b { color:var(--go); }
  #side { display:flex; flex-direction:column; gap:8px; }
  #side button { flex:1; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:14px; font:800 14px system-ui; letter-spacing:.05em; }
  #side button:active, #side button.on { background:var(--amber); color:#1a1200; }
  #brake.on { background:var(--red) !important; color:#fff !important; }
  #ready { background:var(--go) !important; color:#00180d !important; }
  #flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .4s; }
  #rotate { display:none; }
  @media (orientation: portrait) {
    #rotate { display:flex; position:fixed; inset:0; z-index:5; background:var(--bg); align-items:center; justify-content:center; text-align:center; padding:24px; color:var(--dim); font-size:18px; }
  }
</style>
</head>
<body>
<div id="start">
  <h1>VALKYRIE</h1>
  <p>Your phone is the yoke. Hold it sideways like a steering wheel.</p>
  <button id="go">Tap to start</button>
  <p id="err"></p>
</div>
<div id="rotate">↻ Turn your phone sideways (landscape)</div>
<div id="app">
  <div id="thr"><div id="thrFill"></div><div id="thrTop">THRUST</div><div id="thrLbl">0%</div></div>
  <div id="mid">
    <div id="horizon"><div id="sky"></div><div id="reticle"></div></div>
    <div id="status">connecting…</div>
  </div>
  <div id="side">
    <button id="ready">READY</button>
    <button id="brake">BRAKE</button>
    <button id="kid">KID</button>
    <button id="centre">CENTRE</button>
    <button id="reset">RETRY</button>
  </div>
</div>
<div id="flash"></div>
<script type="module" src="./yoke.js"></script>
</body>
</html>
